name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            for await (const page of github.paginate.iterator(github.rest.actions.listArtifactsForRepo, { owner: repo.owner, repo: repo.repo, per_page: 100 })) {
              for (const a of page.data) {
                if (!a.expired) {
                  try { await github.rest.actions.deleteArtifact({ owner: repo.owner, repo: repo.repo, artifact_id: a.id }); } catch (e) {}
                }
              }
            }

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: perception-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
